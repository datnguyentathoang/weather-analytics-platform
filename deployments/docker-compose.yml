version: '3.8'

services:
  # 1. Object Storage: MinIO Data Lake
  minio:
    image: minio/minio:latest
    container_name: weather_minio
    ports:
      - "9000:9000"  # API Port cho Python/Spark kết nối
      - "9001:9001"  # Web UI để xem dữ liệu bằng mắt
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # Tự động tạo sẵn bucket weather-raw khi bật hạ tầng
  init-minio:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadminpassword) do sleep 1; done;
      /usr/bin/mc mb myminio/weather-raw || true;
      exit 0;
      "

  # 2. Streaming Platform: Apache Kafka & Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: weather_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: weather_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"  # Cổng kết nối code stream
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # Giao diện quản lý hàng đợi Kafka UI trực quan
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: weather_kafka_ui
    ports:
      - "8085:8080"
    depends_on:
      - kafka
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # 3. Data Warehouse: PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: weather_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: adminweather123
      POSTGRES_DB: weather_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 4. Analytics Layer: Metabase Dashboard BI
  metabase:
    image: metabase/metabase:latest
    container_name: weather_metabase
    ports:
      - "3000:3000"
    depends_on:
      - postgres

volumes:
  minio_data:
  postgres_data:
